<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Monitor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="admin-container">
        <header class="admin-header">
            <div class="status-group">
                <span id="status-dot" class="dot offline"></span>
                <h1>SYSTEM MONITOR</h1>
            </div>
            <div class="stats">
                <span id="connection-id">Not Connected</span>
            </div>
        </header>

        <main id="monitor" class="log-container"></main>
        
        <footer class="admin-footer">
            <button onclick="clearLogs()">Clear Console</button>
            <div id="log-count">0 entries</div>
        </footer>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="monitor.js"></script>
</body>
</html>
